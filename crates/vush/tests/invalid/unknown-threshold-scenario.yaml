# a threshold for a scenario that does not exist
schema_version: 1
name: broken
scenarios:
  - name: ping
    load: { model: closed_vus, vus: 1, iterations: 1 }
    steps:
      - request: { method: GET, url: "http://localhost:8080/" }
thresholds:
  - metric: error_rate
    scenario: pong
    lt: 1%
