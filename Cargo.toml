[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Weilei424/vush"
publish = false

[workspace.dependencies]
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
h2 = "0.4"
http = "1"
http-body-util = "0.1"
hyper = "1"
hyper-util = "0.1"
percent-encoding = "2"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
saphyr-parser = "0.3"
serde_json = "1"
tokio = "1"
tokio-rustls = { version = "0.26", default-features = false }
tower-service = "0.3"
url = "2"
vush-config = { path = "crates/vush-config" }
vush-core = { path = "crates/vush-core" }
vush-http = { path = "crates/vush-http" }

[workspace.lints.rust]
unsafe_code = "forbid"
