[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Weilei424/vush"
publish = false

[workspace.dependencies]
clap = { version = "4.6", features = ["derive"] }
saphyr-parser = "0.3"
serde_json = "1"
vush-config = { path = "crates/vush-config" }
vush-core = { path = "crates/vush-core" }

[workspace.lints.rust]
unsafe_code = "forbid"
