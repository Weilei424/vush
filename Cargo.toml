[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/Weilei424/vush"
publish = false

[workspace.dependencies]
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
http = "1"
percent-encoding = "2"
saphyr-parser = "0.3"
serde_json = "1"
url = "2"
vush-config = { path = "crates/vush-config" }
vush-core = { path = "crates/vush-core" }
vush-http = { path = "crates/vush-http" }

[workspace.lints.rust]
unsafe_code = "forbid"
